{% extends 'generic/object_edit.html' %}
{% load i18n %}

{% block buttons %}
  <a href="{{ return_url }}" class="btn btn-outline-secondary">
    {% trans "Cancel" %}
  </a>

  {% if object.pk %}
    <button type="submit"
            name="release"
            value="1"
            class="btn btn-danger">
      <i class="mdi mdi-trash-can-outline"></i>
      Release
    </button>

    <button type="submit"
            name="_update"
            class="btn btn-primary">
      {% trans "Save" %}
    </button>
  {% else %}
    <div class="btn-group">
      <button type="submit"
              name="_create"
              class="btn btn-primary">
        {% trans "Create" %}
      </button>

      <button type="submit"
              name="_addanother"
              class="btn btn-outline-primary">
        {% trans "Create & Add Another" %}
      </button>
    </div>
  {% endif %}
{% endblock %}
